<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>包装盒刀版图 2D → 3D 预览</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--tx:#1f2937;--mut:#6b7280;--ac:#2563eb;--bd:#e5e7eb;--st:#eceff4}
@media(prefers-color-scheme:dark){:root{--bg:#111318;--card:#1a1d24;--tx:#e5e7eb;--mut:#9ca3af;--bd:#2b2f38;--st:#14161c;--ac:#60a5fa}}
*{box-sizing:border-box}
body{margin:0;height:100vh;display:flex;flex-direction:column;font:14px/1.5 system-ui,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--tx)}
header{padding:10px 18px;font-weight:600;background:var(--card);border-bottom:1px solid var(--bd)}
header small{font-weight:400;color:var(--mut);margin-left:10px}
main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
section{background:var(--card);border:1px solid var(--bd);border-radius:10px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
h2{margin:0;padding:9px 12px;font-size:13px}
h2 span{font-weight:400;color:var(--mut);margin-left:8px}
.bar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:8px 12px;border-top:1px solid var(--bd)}
label{display:flex;align-items:center;gap:6px;white-space:nowrap}
output{min-width:38px;color:var(--mut);font-size:12px}
input[type=number]{width:64px;padding:3px 6px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx)}
input[type=range]{width:110px;accent-color:var(--ac)}
input[type=color]{width:34px;height:24px;border:0;padding:0;background:none}
button{padding:5px 12px;border:1px solid var(--ac);border-radius:6px;background:var(--ac);color:#fff;cursor:pointer}
button.g{background:none;color:var(--ac)}
.stage{flex:1;min-height:220px;position:relative;overflow:hidden;background:var(--st);touch-action:none}
#v2{display:flex;align-items:center;justify-content:center;cursor:move}
#nw{position:relative}#svg{position:absolute;inset:0;width:100%;height:100%;color:var(--tx)}
#v3{perspective:1800px;cursor:grab}
#world{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d}
#model{position:absolute;left:0;top:0;transform-style:preserve-3d}
.face{position:absolute;transform-style:preserve-3d}
.face>*{position:absolute;left:0;top:0;width:100%;height:100%;backface-visibility:hidden}
.i{background:#efe6d3;transform:rotateY(180deg);box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.tip{margin:0;padding:6px 12px;font-size:12px;color:var(--mut);border-top:1px solid var(--bd)}
@media(max-width:820px){body{height:auto}main{grid-template-columns:1fr}section{min-height:520px}}
</style></head><body>
<header>📦 包装盒刀版图 2D → 3D 预览<small>标准十字型 · 纯前端 · 离线可用</small></header>
<main>
<section>
<h2>刀版图（2D）<span>有贴图时：拖动平移、滚轮缩放</span></h2>
<div class="bar">
<label>长 W<input type="number" data-k="W" min="10" max="600"></label>
<label>宽 D<input type="number" data-k="D" min="10" max="600"></label>
<label>高 H<input type="number" data-k="H" min="10" max="600"></label>mm<label>插舌 T<input type="number" data-k="T" min="5" max="100"></label><label>糊边 G<input type="number" data-k="G" min="5" max="60"></label>
<button id="exp">导出 SVG</button><label><input type="checkbox" id="wt">含贴图</label>
</div>
<div class="stage" id="v2"><div id="nw"><svg id="svg"></svg></div></div>
<p class="tip"><b style="color:#e11d48">━</b> 红实线：裁切线　<b style="color:#2563eb">╍</b> 蓝虚线：折叠线　布局：左/前/右/后四面成排，顶、底面接于前面；顶/底面带插舌，左面带糊边</p>
</section>
<section>
<h2>3D 预览<span>拖动旋转、滚轮缩放</span></h2>
<div class="stage" id="v3"><div id="world"><div id="model"></div></div></div>
<div class="bar">
<label>折叠<input type="range" data-k="fold" min="0" max="1" step=".01"><output></output></label>
<button id="play">播放 折叠/展开</button>
<label><input type="checkbox" id="auto">自动旋转</label>
<button id="reset" class="g">重置视角</button>
</div>
<div class="bar">
<input type="file" id="file" accept="image/*">
<label>缩放<input type="range" data-k="sc" min="20" max="300"><output></output></label>
<label>水平<input type="range" data-k="ox" min="-100" max="100"><output></output></label>
<label>垂直<input type="range" data-k="oy" min="-100" max="100"><output></output></label>
<label>旋转<input type="range" data-k="rot" min="-180" max="180"><output></output></label>
<label>底色<input type="color" data-k="color"></label>
<button id="clr" class="g">清除贴图</button>
</div>
</section>
</main>
<script>
const $=s=>document.querySelector(s),cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const S={W:120,D:80,H:160,T:20,G:15,fold:.65,sc:100,ox:0,oy:0,rot:0,color:'#d8b88a'};
let img=null,L,el={},cv={},PX=1,rx=-24,ry=-32,zm=1,tgt=null,q=0;
const net=document.createElement('canvas'),nc=net.getContext('2d');
const model=$('#model'),world=$('#world'),nw=$('#nw'),svg=$('#svg'),v2=$('#v2'),v3=$('#v3');
nw.prepend(net);
const NW=()=>2*S.W+2*S.D+S.G,NH=()=>2*S.D+S.H+2*S.T,M=()=>Math.max(NW(),NH())*.09;
const cham=()=>({c:Math.min(S.T*.6,S.W/4),g:Math.min(S.G*.8,S.H/4)});
const layout=()=>{const{W,D,H,G,T}=S,a=G,b=T,{c,g}=cham(),pc=c/W*100,pg=g/H*100;return{
 top:{x:a+D,y:b,w:W,h:D,n:'顶面'},left:{x:a,y:b+D,w:D,h:H,n:'左面'},front:{x:a+D,y:b+D,w:W,h:H,n:'前面'},
 right:{x:a+D+W,y:b+D,w:D,h:H,n:'右面'},back:{x:a+2*D+W,y:b+D,w:W,h:H,n:'后面'},bottom:{x:a+D,y:b+D+H,w:W,h:D,n:'底面'},
 tuckT:{x:a+D,y:0,w:W,h:T,n:'顶插舌',p:`0% 100%,${pc}% 0%,${100-pc}% 0%,100% 100%`},
 tuckB:{x:a+D,y:b+2*D+H,w:W,h:T,n:'底插舌',p:`0% 0%,100% 0%,${100-pc}% 100%,${pc}% 100%`},
 glue:{x:0,y:b+D,w:G,h:H,n:'糊边',p:`100% 0%,0% ${pg}%,0% ${100-pg}%,100% 100%`}}};
const outline=()=>{const{W,D,H,G,T}=S,a=G,b=T,{c,g}=cham(),N=NH();return[[a+D,b],[a+D+c,0],[a+D+W-c,0],[a+D+W,b],[a+D+W,b+D],[a+2*D+2*W,b+D],[a+2*D+2*W,b+D+H],[a+D+W,b+D+H],[a+D+W,b+2*D+H],[a+D+W-c,N],[a+D+c,N],[a+D,b+2*D+H],[a+D,b+D+H],[a,b+D+H],[0,b+D+H-g],[0,b+D+g],[a,b+D],[a+D,b+D]]};

/* 贴图画布：覆盖整张刀版，2D 显示与 3D 各面共用 */
function drawNet(){
 const w=NW(),h=NH();PX=Math.min(8,2200/Math.max(w,h));
 net.width=Math.round(w*PX);net.height=Math.round(h*PX);
 nc.fillStyle=S.color;nc.fillRect(0,0,net.width,net.height);
 if(img){nc.save();nc.translate(net.width*(.5+S.ox/100),net.height*(.5+S.oy/100));nc.rotate(S.rot*Math.PI/180);
  const k=Math.max(net.width/img.width,net.height/img.height)*S.sc/100;nc.scale(k,k);nc.drawImage(img,-img.width/2,-img.height/2);nc.restore()}
 else{nc.textAlign='center';nc.textBaseline='middle';nc.fillStyle='rgba(0,0,0,.28)';
  for(const k in L){const f=L[k];if(f.p)continue;nc.font=`600 ${Math.min(f.w,f.h)*.28*PX}px sans-serif`;nc.fillText(f.n,(f.x+f.w/2)*PX,(f.y+f.h/2)*PX)}}
}
function drawFaces(){
 for(const k in L){const f=L[k],c=cv[k],g=c.getContext('2d');
  c.width=Math.round(f.w*PX);c.height=Math.round(f.h*PX);
  g.drawImage(net,f.x*PX,f.y*PX,f.w*PX,f.h*PX,0,0,c.width,c.height);
  g.strokeStyle='rgba(0,0,0,.3)';g.lineWidth=2;g.strokeRect(0,0,c.width,c.height)}
}
const refresh=()=>{drawNet();drawFaces()};
const sch=()=>q||(q=requestAnimationFrame(()=>{q=0;refresh()}));

/* 刀版 SVG（显示与导出共用，单位 mm） */
function dl(ex,tex){
 const{W,D,H}=S,m=M(),w=NW(),h=NH(),sw=ex?.35:1.6,v=ex?'':' vector-effect="non-scaling-stroke"',fs=m*.28;
 const pts=outline().map(p=>p.join(',')).join(' ');
 const t=(x,y,s,z=fs,r)=>`<text x="${x}" y="${y}" font-size="${z}" text-anchor="middle" fill="${ex?'#555':'currentColor'}"${r?` transform="rotate(-90 ${x} ${y})"`:''}>${s}</text>`;
 let s=`<g transform="translate(${m} ${m})">`;
 if(tex)s+=`<clipPath id="c"><polygon points="${pts}"/></clipPath><image xlink:href="${net.toDataURL('image/png')}" width="${w}" height="${h}" clip-path="url(#c)"/>`;
 {const a=S.G,b=S.T,X=[a,a+D,a+D+W,a+2*D+W],Y=[b,b+D,b+D+H,b+2*D+H];s+=`<path d="${Y.map(y=>`M${a+D} ${y}H${a+D+W}`).join('')+X.map(x=>`M${x} ${b+D}V${b+D+H}`).join('')}" fill="none" stroke="#2563eb" stroke-width="${sw}" stroke-dasharray="${ex?'3 2':'6 4'}"${v}/>`}
 s+=`<polygon points="${pts}" fill="none" stroke="#e11d48" stroke-width="${sw*1.2}" stroke-linejoin="round"${v}/>`;
 s+=t(S.G+D+W/2,-m*.3,`长 W = ${W} mm`)+t(-m*.3,S.T+D+H/2,`高 H = ${H} mm`,fs,1)+t(S.G+D/2,S.T+D+H+m*.45,`宽 D = ${D} mm`);
 if(ex)for(const k in L){const f=L[k];s+=t(f.x+f.w/2,f.y+f.h/2,f.n,Math.min(f.w,f.h)*.14)}
 return s+'</g>';
}

/* 3D 结构：前面为根，左/右/顶/底挂在前面，后面挂在右面 */
function rebuild(){
 L=layout();model.innerHTML='';el={};cv={};
 const mk=(k,p,css)=>{const f=L[k],d=document.createElement('div'),c=document.createElement('canvas'),i=document.createElement('div');
  d.className='face';d.style.cssText=`width:${f.w}px;height:${f.h}px;${css}`;i.className='i';if(f.p)c.style.clipPath=i.style.clipPath=`polygon(${f.p})`;d.append(c,i);p.append(d);cv[k]=c;el[k]=d};
 const{W,D,H,T,G}=S;
 mk('front',model,'left:0;top:0');
 mk('right',el.front,`left:${W}px;top:0;transform-origin:0 50%`);
 mk('back',el.right,`left:${D}px;top:0;transform-origin:0 50%`);
 mk('left',el.front,`left:${-D}px;top:0;transform-origin:100% 50%`);
 mk('top',el.front,`left:0;top:${-D}px;transform-origin:50% 100%`);
 mk('bottom',el.front,`left:0;top:${H}px;transform-origin:50% 0`);
 mk('tuckT',el.top,`left:0;top:${-T}px;transform-origin:50% 100%`);
 mk('tuckB',el.bottom,`left:0;top:${D}px;transform-origin:50% 0`);
 mk('glue',el.left,`left:${-G}px;top:0;transform-origin:100% 50%`);
 const m=M(),vw=NW()+2*m,vh=NH()+2*m;
 Object.assign(net.style,{position:'absolute',left:m/vw*100+'%',top:m/vh*100+'%',width:NW()/vw*100+'%',height:NH()/vh*100+'%',
  clipPath:`polygon(${outline().map(p=>`${p[0]/NW()*100}% ${p[1]/NH()*100}%`).join(',')})`});
 svg.setAttribute('viewBox',`0 0 ${vw} ${vh}`);svg.innerHTML=dl(0,0);
 refresh();pose();fit2();view();
}
function pose(){
 const f=S.fold,a=cl(f/.5)*90,g=cl((f-.45)/.2)*95,b=cl((f-.5)/.3)*90,c=cl((f-.75)/.25)*95,{W,G,D,H}=S,T=(k,t)=>el[k].style.transform=t;
 T('right',`rotateY(${a}deg)`);T('back',`rotateY(${a}deg)`);T('left',`rotateY(${-a}deg)`);T('glue',`rotateY(${-g}deg)`);
 T('top',`rotateX(${b}deg)`);T('bottom',`rotateX(${-b}deg)`);T('tuckT',`rotateX(${c}deg)`);T('tuckB',`rotateX(${-c}deg)`);
 model.style.transform=`translate3d(${-(W-G/2)*(1-f)-W/2*f}px,${-H/2}px,${D/2*f}px)`; /* 枢轴：刀版中心 → 盒体中心 */
 view();
}
function view(){
 const r=v3.getBoundingClientRect(),s0=Math.max(NW(),NH()),s1=Math.hypot(S.W,S.H,S.D),s=s0+(s1-s0)*S.fold;
 world.style.transform=`scale(${.85*Math.min(r.width,r.height)/s*zm}) rotateX(${rx}deg) rotateY(${ry}deg)`;
}
function fit2(){
 const m=M(),vw=NW()+2*m,vh=NH()+2*m,r=v2.getBoundingClientRect(),k=Math.min(r.width/vw,r.height/vh)*.96;
 nw.style.width=vw*k+'px';nw.style.height=vh*k+'px';
}
function sync(){
 document.querySelectorAll('[data-k]').forEach(i=>{const k=i.dataset.k;i.value=S[k];const o=i.nextElementSibling;
  if(o&&o.tagName==='OUTPUT')o.value=k==='fold'?Math.round(S[k]*100)+'%':Math.round(S[k])});
}

/* 控件 */
document.querySelectorAll('[data-k]').forEach(i=>i.addEventListener('input',()=>{
 const k=i.dataset.k,v=i.type==='color'?i.value:+i.value;
 const lim={W:[10,600],D:[10,600],H:[10,600],T:[5,100],G:[5,60]}[k];
 if(lim&&!(v>=lim[0]&&v<=lim[1]))return;
 S[k]=v;sync0(i);
 if(lim)rebuild();else if(k==='fold')pose();else sch();
}));
function sync0(i){const o=i.nextElementSibling;if(o&&o.tagName==='OUTPUT')o.value=i.dataset.k==='fold'?Math.round(S.fold*100)+'%':Math.round(S[i.dataset.k])}
$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();
 im.onload=()=>{img=im;Object.assign(S,{sc:100,ox:0,oy:0,rot:0});sync();refresh()};im.src=URL.createObjectURL(f)};
$('#clr').onclick=()=>{img=null;$('#file').value='';Object.assign(S,{sc:100,ox:0,oy:0,rot:0});sync();refresh()};
$('#play').onclick=()=>tgt=S.fold>.5?0:1;
$('#reset').onclick=()=>{rx=-24;ry=-32;zm=1;view()};
$('#exp').onclick=()=>{
 const m=M(),vw=NW()+2*m,vh=NH()+2*m,tex=$('#wt').checked&&img;
 const x=`<?xml version="1.0" encoding="UTF-8"?>\n<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="${vw}mm" height="${vh}mm" viewBox="0 0 ${vw} ${vh}">${dl(1,tex)}</svg>`;
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([x],{type:'image/svg+xml'}));
 a.download=`dieline_${S.W}x${S.D}x${S.H}.svg`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1e3);
};

/* 3D 拖拽旋转 / 滚轮缩放 */
let d3=null,d2=null;
v3.onpointerdown=e=>{d3=[e.clientX,e.clientY];v3.setPointerCapture(e.pointerId);v3.style.cursor='grabbing'};
v3.onpointermove=e=>{if(!d3)return;ry+=(e.clientX-d3[0])*.5;rx=cl(rx-(e.clientY-d3[1])*.5,-90,90);d3=[e.clientX,e.clientY];view()};
v3.onpointerup=()=>{d3=null;v3.style.cursor='grab'};
v3.onwheel=e=>{e.preventDefault();zm=cl(zm*Math.exp(-e.deltaY*.001),.3,4);view()};
/* 2D 拖拽平移贴图 / 滚轮缩放贴图 */
v2.onpointerdown=e=>{if(img){d2=[e.clientX,e.clientY];v2.setPointerCapture(e.pointerId)}};
v2.onpointermove=e=>{if(!d2)return;const r=net.getBoundingClientRect();
 S.ox=cl(S.ox+(e.clientX-d2[0])/r.width*100,-100,100);S.oy=cl(S.oy+(e.clientY-d2[1])/r.height*100,-100,100);d2=[e.clientX,e.clientY];sync();sch()};
v2.onpointerup=()=>d2=null;
v2.onwheel=e=>{if(!img)return;e.preventDefault();S.sc=cl(S.sc*Math.exp(-e.deltaY*.001),20,300);sync();sch()};

/* 动画循环：折叠动画 + 自动旋转 */
let last=0;
(function tick(t){
 const dt=Math.min(.1,(t-last)/1000||0);last=t;
 if(tgt!==null){const d=tgt-S.fold,st=dt/2.2;S.fold=Math.abs(d)<=st?tgt:S.fold+Math.sign(d)*st;if(S.fold===tgt)tgt=null;sync();pose()}
 if($('#auto').checked&&!d3){ry+=dt*25;view()}
 requestAnimationFrame(tick);
})(0);
new ResizeObserver(()=>{fit2();view()}).observe(v2);new ResizeObserver(view).observe(v3);
sync();rebuild();
</script></body></html>
